<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="description" content="Gova Crédit — Achetez vos unités Moov, MTN et Orange CI en ligne.">
  <title>Gova Crédit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:        #F2F4F7;
      --card:      #FFFFFF;
      --border:    #E4E7EC;
      --dark:      #101828;
      --mid:       #475467;
      --light:     #98A2B3;
      --radius:    14px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
      color: var(--dark);
    }

    /* ── HEADER ── */
    .header {
      width: 100%;
      max-width: 420px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: -0.4px;
    }

    .header p {
      font-size: 13px;
      color: var(--mid);
      margin-top: 3px;
    }

    /* ── CARTE ── */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(16,24,40,0.11);
    }

    .card-body { padding: 28px 24px 24px; }
    .card-footer { padding: 0 24px 24px; }

    /* ── LABELS ── */
    .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--light);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .groupe { margin-bottom: 24px; }

    /* ── TÉLÉPHONE ── */
    .input-wrap { position: relative; }

    .prefix {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      font-weight: 500;
      color: var(--mid);
      pointer-events: none;
    }

    input[type="tel"],
    input[type="number"] {
      width: 100%;
      height: 48px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      color: var(--dark);
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="tel"] { padding: 0 16px 0 62px; }
    input[type="number"] { padding: 0 16px; }
    input:focus { border-color: var(--dark); }
    input::placeholder { color: var(--light); font-weight: 400; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ── OPÉRATEURS ── */
    .operateurs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .btn-ope {
      height: 76px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-ope:hover { background: #FAFAFA; border-color: #C0C8D8; }
    .btn-ope.actif { border-color: var(--dark); background: #F8F9FB; }

    /* Trait couleur opérateur en bas quand actif */
    .btn-ope::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 0 0 2px 2px;
    }
    .btn-ope.moov.actif::after   { background: #0055AA; }
    .btn-ope.mtn.actif::after    { background: #F5C400; }
    .btn-ope.orange.actif::after { background: #FF6200; }

    /* Badge opérateur */
    .ope-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 5px;
      letter-spacing: 0.3px;
    }

    .moov   .ope-badge { background: #E8F0FB; color: #0055AA; }
    .mtn    .ope-badge { background: #F5C400; color: #1A1A00; }
    .orange .ope-badge { background: #FF6200; color: #fff; }

    .ope-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--mid);
    }

    .btn-ope.actif .ope-name { color: var(--dark); }

    /* ── MONTANTS RAPIDES ── */
    .montants-rapides {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn-montant {
      height: 40px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--mid);
      transition: all 0.15s;
    }

    .btn-montant:hover,
    .btn-montant.actif {
      border-color: var(--dark);
      color: var(--dark);
      background: #F8F9FB;
    }

    /* ── RÉSUMÉ FRAIS ── */
    .resume {
      background: #F8F9FB;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 14px;
      display: none;
    }

    .resume.visible {
      display: block;
      animation: fadeUp 0.22s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .resume-ligne {
      display: flex;
      justify-content: space-between;
      font-size: 13.5px;
      color: var(--mid);
      padding: 4px 0;
    }

    .resume-ligne.total {
      border-top: 1px solid var(--border);
      margin-top: 8px;
      padding-top: 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
    }

    .resume-ligne .val { font-weight: 600; color: var(--dark); }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0 0;
    }

    /* ── MESSAGE ── */
    .message {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 14px;
      display: none;
      gap: 10px;
      align-items: flex-start;
      line-height: 1.5;
    }

    .message.visible { display: flex; animation: fadeUp 0.22s ease; }
    .message.info    { background: #EFF4FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
    .message.succes  { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; }
    .message.erreur  { background: #FFF1F2; color: #B91C1C; border: 1px solid #FECDD3; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(29,78,216,0.25);
      border-top-color: #1D4ED8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── BOUTON PAYER ── */
    .btn-payer {
      width: 100%;
      height: 52px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 16px;
    }

    .btn-payer:hover:not(:disabled)  { background: #344054; }
    .btn-payer:active:not(:disabled) { transform: scale(0.99); }
    .btn-payer:disabled { background: #D0D5DD; color: #98A2B3; cursor: not-allowed; }

    /* ── FOOTER PAGE ── */
    .page-footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (max-width: 360px) {
      .montants-rapides { grid-template-columns: repeat(2, 1fr); }
      .card-body, .card-footer { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>

  <!-- HEADER — juste le texte, pas de logo -->
  <header class="header">
    <h1>Gova Crédit</h1>
    <p>Transfert d'unités mobiles · Côte d'Ivoire</p>
  </header>

  <div class="card">
    <form id="formulaire" novalidate>
      <div class="card-body">

        <!-- Numéro -->
        <div class="groupe">
          <div class="label">Numéro bénéficiaire</div>
          <div class="input-wrap">
            <span class="prefix">+225</span>
            <input type="tel" id="telephone" placeholder="07 00 00 00 00"
              inputmode="numeric" maxlength="13" autocomplete="tel" required>
          </div>
        </div>

        <!-- Opérateur -->
        <div class="groupe">
          <div class="label">Opérateur</div>
          <div class="operateurs" role="group">

            <button type="button" class="btn-ope moov" data-ope="MOOV" aria-pressed="false">
              <span class="ope-badge">MOOV</span>
              <span class="ope-name">Moov Africa</span>
            </button>

            <button type="button" class="btn-ope mtn" data-ope="MTN" aria-pressed="false">
              <span class="ope-badge">MTN</span>
              <span class="ope-name">MTN CI</span>
            </button>

            <button type="button" class="btn-ope orange" data-ope="ORANGE" aria-pressed="false">
              <span class="ope-badge">ORANGE</span>
              <span class="ope-name">Orange CI</span>
            </button>

          </div>
          <input type="hidden" id="operateur" required>
        </div>

        <!-- Montant -->
        <div class="groupe" style="margin-bottom: 0;">
          <div class="label">Montant des unités (FCFA)</div>
          <div class="montants-rapides">
            <button type="button" class="btn-montant" data-val="500">500</button>
            <button type="button" class="btn-montant" data-val="1000">1 000</button>
            <button type="button" class="btn-montant" data-val="2000">2 000</button>
            <button type="button" class="btn-montant" data-val="5000">5 000</button>
          </div>
          <input type="number" id="montant" placeholder="Autre montant" min="100" max="100000"
            inputmode="numeric" style="margin-top: 8px;">
        </div>

        <!-- Résumé des frais -->
        <div class="resume" id="resume" aria-live="polite">
          <div class="resume-ligne">
            <span>Unités reçues</span>
            <span class="val" id="aff-demande">—</span>
          </div>
          <div class="resume-ligne">
            <span>Frais de service (7%)</span>
            <span class="val" id="aff-commission">—</span>
          </div>
          <div class="resume-ligne total">
            <span>Total à payer</span>
            <span class="val" id="aff-total">—</span>
          </div>
        </div>

      </div><!-- fin card-body -->

      <hr class="divider">

      <div class="card-footer">
        <div class="message" id="message" role="alert"></div>
        <button type="submit" class="btn-payer" id="btn-payer" disabled>
          Payer et recevoir mes unités
        </button>
      </div>

    </form>
  </div>

  <footer class="page-footer">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    Paiement sécurisé par CinetPay
  </footer>

  <script>
    const BACKEND = window.location.hostname === 'localhost'
      ? window.location.origin
      : 'https://gova-credit-production.up.railway.app';

    let operateurChoisi = null;

    // Sélection opérateur
    document.querySelectorAll('.btn-ope').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-ope').forEach(b => {
          b.classList.remove('actif');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('actif');
        btn.setAttribute('aria-pressed', 'true');
        operateurChoisi = btn.dataset.ope;
        document.getElementById('operateur').value = operateurChoisi;
        recalculer();
      });
    });

    // Montants rapides
    document.querySelectorAll('.btn-montant').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-montant').forEach(b => b.classList.remove('actif'));
        btn.classList.add('actif');
        document.getElementById('montant').value = btn.dataset.val;
        recalculer();
      });
    });

    document.getElementById('montant').addEventListener('input', () => {
      document.querySelectorAll('.btn-montant').forEach(b => b.classList.remove('actif'));
      recalculer();
    });

    // Calcul des frais
    function recalculer() {
      const montant = parseInt(document.getElementById('montant').value) || 0;
      const resume  = document.getElementById('resume');
      const btn     = document.getElementById('btn-payer');

      if (montant >= 100 && operateurChoisi) {
        const total      = Math.ceil(montant * 1.07 / 10) * 10;
        const commission = total - montant;

        document.getElementById('aff-demande').textContent    = montant.toLocaleString('fr-FR') + ' FCFA';
        document.getElementById('aff-commission').textContent = commission.toLocaleString('fr-FR') + ' FCFA';
        document.getElementById('aff-total').textContent      = total.toLocaleString('fr-FR') + ' FCFA';

        resume.classList.add('visible');
        btn.disabled    = false;
        btn.textContent = 'Payer ' + total.toLocaleString('fr-FR') + ' FCFA';
      } else {
        resume.classList.remove('visible');
        btn.disabled    = true;
        btn.textContent = 'Payer et recevoir mes unités';
      }
    }

    // Soumission
    document.getElementById('formulaire').addEventListener('submit', async e => {
      e.preventDefault();

      const telephone = document.getElementById('telephone').value.trim();
      const operateur = document.getElementById('operateur').value;
      const montant   = parseInt(document.getElementById('montant').value);
      const btn       = document.getElementById('btn-payer');

      if (!telephone || telephone.replace(/\D/g, '').length < 8) {
        afficherMessage('erreur', 'Veuillez entrer un numéro valide (min. 8 chiffres).'); return;
      }
      if (!operateur) {
        afficherMessage('erreur', 'Veuillez sélectionner un opérateur.'); return;
      }
      if (!montant || montant < 100) {
        afficherMessage('erreur', 'Le montant minimum est de 100 FCFA.'); return;
      }

      btn.disabled    = true;
      btn.textContent = 'Traitement en cours...';
      afficherMessage('info', 'Création du paiement, veuillez patienter...', true);

      try {
        const rep  = await fetch(`${BACKEND}/initier-paiement`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telephone, operateur, montant }),
        });
        const data = await rep.json();

        if (data.succes && data.payment_url) {
          afficherMessage('succes', 'Redirection vers CinetPay...');
          setTimeout(() => { window.location.href = data.payment_url; }, 1000);
        } else {
          afficherMessage('erreur', data.message || 'Une erreur est survenue.');
          resetBtn(montant);
        }
      } catch {
        afficherMessage('erreur', 'Erreur réseau. Vérifiez votre connexion et réessayez.');
        resetBtn(montant);
      }
    });

    function afficherMessage(type, texte, spinner = false) {
      const el    = document.getElementById('message');
      const icons = { info: 'ℹ', succes: '✓', erreur: '⚠' };
      el.className  = 'message ' + type + ' visible';
      el.innerHTML  = spinner
        ? '<div class="spinner"></div><span>' + texte + '</span>'
        : '<span>' + icons[type] + '</span><span>' + texte + '</span>';
    }

    function resetBtn(montant) {
      const total = Math.ceil(montant * 1.07 / 10) * 10;
      const btn   = document.getElementById('btn-payer');
      btn.disabled    = false;
      btn.textContent = 'Réessayer — ' + total.toLocaleString('fr-FR') + ' FCFA';
    }
  </script>
</body>
</html>
