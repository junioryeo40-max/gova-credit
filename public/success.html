<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Confirmation — Gova Crédit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F2F4F7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #101828;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(16,24,40,0.12);
      text-align: center;
    }

    .check-wrap {
      width: 64px;
      height: 64px;
      background: #F0FDF4;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .check-wrap svg {
      width: 30px;
      height: 30px;
      stroke: #15803D;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #475467;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .info-box {
      background: #F8F9FB;
      border: 1px solid #E4E7EC;
      border-radius: 12px;
      padding: 16px;
      font-size: 13.5px;
      color: #475467;
      line-height: 1.6;
      margin-bottom: 24px;
      text-align: left;
    }

    .info-box strong { color: #101828; }

    .btn {
      display: block;
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-primary {
      background: #101828;
      color: #fff;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: #F2F4F7;
      color: #344054;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-wrap">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Paiement reçu</h1>
    <p>Votre paiement a bien été enregistré. Vos unités sont en cours d'envoi sur le numéro indiqué.</p>

    <div class="info-box">
      Délai d'envoi estimé : <strong>2 à 5 minutes</strong> après confirmation du paiement.<br><br>
      Si vous ne recevez pas vos unités, contactez notre support.
    </div>

    <a href="/" class="btn btn-primary">Faire un autre achat</a>
    <a href="/" class="btn btn-secondary">Retour à l'accueil</a>
  </div>
</body>
</html>
